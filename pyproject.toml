[project]
name = "arima-lstm-comparison"
version = "0.1.0"
description = "Comparison of ARIMA, LSTM and ARIMA-LSTM for financial forecasting"
authors = [{ name = "Khanukaev Viktor Vasilevich" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "statsmodels>=0.14,<1",
    "tensorflow>=2.16,<3",
    "yfinance>=0.2.54,<1",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
black = ">=24.10,<27"
mypy = ">=1.14,<2"
pandas-stubs = ">=2.2,<3"
pre-commit = ">=4,<5"
pytest = ">=8,<10"
ruff = ">=0.9,<1"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["data", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"
